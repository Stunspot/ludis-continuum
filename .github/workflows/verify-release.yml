name: Verify release

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run regression suite
        run: python -B -m unittest discover -s scripts/tests -v
      - name: Run curated runtime self-check
        run: python -B scripts/self_check.py
      - name: Rebuild customer release
        run: python tools/build_customer_release.py
      - name: Verify customer release
        run: python tools/verify_customer_release.py release-v1.1.0 --outer release-assets/v1.1.0/Ludis-Continuum-v1.1.0.zip
      - name: Verify documentation fingerprint
        run: python tools/build_documentation_fingerprint.py --check
      - name: Require deterministic clean rebuild
        run: git diff --exit-code
