name: Verify release

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run regression suite
        run: python -B -m unittest discover -s scripts/tests -v
      - name: Run curated runtime self-check
        run: python -B scripts/self_check.py
      - name: Verify current release and deterministic reconstruction
        run: python -B tools/verify_current_release.py
      - name: Verify documentation fingerprint
        run: python tools/build_documentation_fingerprint.py --check
      - name: Require clean source after verification
        run: git diff --exit-code
